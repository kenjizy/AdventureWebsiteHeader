<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Shoe Store</title>
  
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">THRIFTY!</div>
    <nav>
      <ul>
        <li><a href="#">Shop</a></li>
        <li><a href="#">My Account</a></li>
        <li><a href="#">Daily Deal</a></li>
        <li><a href="#">Wishlist</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Running Shoes</h1>
    <p>Do it now. Run on air.</p>
    <button>Shop Now</button>
  </section>

  <!-- FEATURED ITEMS -->
  <section class="products">
    <h2>Featured Items</h2>
    <div class="product-grid">
      <div class="product">
        <img src="images/KAII.jfif" alt="Shoe">
        <h3>Speed 500 Shoe</h3>
        <p>$120.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/KAMI.jfif" alt="Shoe">
        <h3>Jordan Hyper Grip</h3>
        <p>$55.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/45.jfif" alt="Shoe">
        <h3>Soccer Ball</h3>
        <p>$30.00</p>
        <button>Add to Cart</button>
      </div>
      <div class="product">
        <img src="images/KANIII.jfif" alt="Shoe">
        <h3>Hoodie Jacket</h3>
        <p>$110.00</p>
        <button>Add to Cart</button>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Porto Shoe Store | All rights reserved.</p>
  </footer>

</body>
</html>
